org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
kotlin.incremental=true

org.gradle.warning.mode=summary

# The one place the version lives. Both modules read it, so the phone and the watch can never
# disagree about what release they are, and the watch cannot end up sharing a version code with
# the phone: Play requires a watch APK's code to be unique across form factors, and two builds
# numbered 5 are rejected without much of an explanation.
weighttrackVersionName=0.4.0
weighttrackVersionCode=5
# The band the watch's codes live in. Phone codes stay below it, watch codes above, so both
# climb on their own without either having to know what the other is on.
weighttrackWearVersionBand=100000
